# Every few hours, pick up 3D models added to (or removed from) archive.org
# and update the free 3D models page. Vercel redeploys automatically when this commits.
name: Sync 3D models from archive.org
on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:
  push:                                   # also run right away when the sync itself changes
    branches: [main]
    paths: [scripts/sync_models.py, .github/workflows/sync-models.yml]
permissions:
  contents: write
  actions: write
concurrency: sync-models
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q pillow
      - run: python scripts/sync_models.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain public)" ]; then
            git config user.name "Eden's Gate"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public
            git commit -m "New 3D models from archive.org"
            git pull --rebase -q
            git push
          fi
      - name: Keep this schedule switched on
        # GitHub pauses schedules after 60 quiet days; this keeps it running.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-models.yml/enable" || true
